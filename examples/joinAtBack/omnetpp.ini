###############################################################################
# Decentralized Demo: 4-car moving platoon + rear vehicle exit
###############################################################################
[Config DeliberatelyDecentralizedRearExit]
description = "TODO: implement decentralized rear/tail vehicle exit without leader coordination"

# ---------------------------------------------------------------------------
# Scenario setup
# ---------------------------------------------------------------------------
*.numActors = 4                          # Initial platoon: veh0..veh3.
*.manager.enableLateSpawn = false        # No late-spawn vehicle needed for exit.

# ---------------------------------------------------------------------------
# Exit configuration
# ---------------------------------------------------------------------------
# Rear-exit case:
#   veh3 exits from the tail of the platoon.
#
# Initial order:
#   veh0 -> veh1 -> veh2 -> veh3
#
# Expected final order:
#   veh0 -> veh1 -> veh2
#
**.actors[*].appl.exit_enabled = false    # TODO: add this parameter in NED/C++.
*.actors[3].appl.exit_enabled = true      # veh3 is selected as the exiting tail vehicle.
*.actors[3].appl.exit_at = 20s            # veh3 starts the exit protocol at t=20s.

# ---------------------------------------------------------------------------
# Controller parameters
# ---------------------------------------------------------------------------
**.actors[*].appl.headway = 0.5s          # Time-headway spacing term.
**.actors[*].appl.gap_min = 5m            # Minimum bumper-to-bumper gap.
**.actors[*].appl.a_min = -4.0            # Braking limit.
**.actors[*].appl.a_max = 2.5             # Acceleration limit.
**.actors[*].appl.nominal_platoon_speed = 10mps

# ---------------------------------------------------------------------------
# V2V behavior
# ---------------------------------------------------------------------------
**.actors[*].appl.beaconInterval = 0.05s  # Beacon broadcast period.
**.actors[*].appl.max_age = 0.2s          # Stale-neighbor threshold.

# ---------------------------------------------------------------------------
# Initial formation
# ---------------------------------------------------------------------------
*.actors[0].appl.initial_formation = "0,1,2,3"
*.actors[1].appl.initial_formation = "0,1,2,3"
*.actors[2].appl.initial_formation = "0,1,2,3"
*.actors[3].appl.initial_formation = "0,1,2,3"

# ---------------------------------------------------------------------------
# Roles
# ---------------------------------------------------------------------------
*.actors[0].appl.actor_id = "veh0"
*.actors[0].appl.platoon_role = "leader"
*.actors[0].appl.node_id = 0

*.actors[1].appl.actor_id = "veh1"
*.actors[1].appl.platoon_role = "follower"
*.actors[1].appl.node_id = 1

*.actors[2].appl.actor_id = "veh2"
*.actors[2].appl.platoon_role = "follower"
*.actors[2].appl.node_id = 2

*.actors[3].appl.actor_id = "veh3"
*.actors[3].appl.platoon_role = "follower"     # TODO: switch to exiting/non_platoon after exit.
*.actors[3].appl.node_id = 3

# ---------------------------------------------------------------------------
# Decentralized rear-exit protocol
# ---------------------------------------------------------------------------
# Correct tail-exit message flow:
#
#   1. veh3 -> veh2: ExitRequest
#        veh3 asks/notifies its predecessor that it intends to leave.
#
#   2. veh2 -> veh3: ExitAck
#        veh2 confirms it is ready to release veh3 and become the new tail.
#
#   3. veh3 leaves the platoon / switches to exiting or non_platoon.
#
# Final local links:
#   veh2.successor = none
#   veh2.is_tail = true
#   veh3 removed from the platoon-local neighbor chain
#
# Notes:
#   - veh0 does not approve the exit.
#   - veh1 does not need to participate.
#   - No successor repair is needed because veh3 is already the tail.
#   - The leader does not broadcast the repaired formation.
#   - This is the simplest decentralized exit case.

# ---------------------------------------------------------------------------
# Files to create / modify
# ---------------------------------------------------------------------------
#
# Note:
#   Upstream Plexe does not provide a dedicated exit maneuver or exit-specific
#   messages. Implement exit as project-owned CARLA platooning logic.
#
# CREATE:
#   src/carla/platooning/maneuver/CarlaExitManeuver.h
#   src/carla/platooning/maneuver/CarlaExitManeuver.cc
#       New decentralized rear-exit state machine.
#       Suggested phases:
#         IDLE
#         SEND_EXIT_REQUEST
#         WAIT_EXIT_ACK
#         EXITING
#         EXIT_COMPLETE
#
#   src/carla/platooning/messages/ExitRequest.msg
#       Sent by exiting tail vehicle to its predecessor.
#
#   src/carla/platooning/messages/ExitAck.msg
#       Sent by predecessor back to the exiting tail vehicle.
#
# MODIFY:
#   src/carla/apps/CarlaGeneralPlatooningApp.h/.cc
#       Add exit_enabled / exit_at parameter handling.
#       Start CarlaExitManeuver when the selected vehicle reaches exit_at.
#       Dispatch ExitRequest and ExitAck.
#       Update predecessor state after successful rear exit.
#       Switch exited vehicle role to exiting or non_platoon.
#
#   src/carla/platooning/state/PlatoonNeighborState.h
#       Store local predecessor/successor state needed for tail detection.
#       Suggested fields:
#         predecessor_id
#         successor_id
#         last_beacon_time
#         relative_distance
#         relative_speed
#         is_tail
#
#   src/carla/platooning/state/PlatoonTypes.h
#       Add role/state values if needed:
#         EXITING
#         NON_PLATOON
#
#   src/carla/apps/CarlaGeneralPlatooningApp.ned
#       Declare new parameters if used by this .ini:
#         exit_enabled
#         exit_at
#
#
# DO NOT MODIFY:
#   pycarlanet/*
#       Bridge only. No exit decisions or formation repair logic.
