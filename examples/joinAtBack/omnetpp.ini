# ---------------------------------------------------------------------------
# Decentralized rear-exit protocol
# ---------------------------------------------------------------------------
# Correct tail-exit message flow:
#
#   1. veh3 -> veh2: ExitRequest
#        veh3 asks/notifies its predecessor that it intends to leave.
#
#   2. veh2 -> veh3: ExitAck
#        veh2 confirms it is ready to release veh3 and become the new tail.
#
#   3. veh3 leaves the platoon / switches to exiting or non_platoon.
#
# Final local links:
#   veh2.successor = none
#   veh2.is_tail = true
#   veh3 removed from the platoon-local neighbor chain
#
# Notes:
#   - veh0 does not approve the exit.
#   - veh1 does not need to participate.
#   - No successor repair is needed because veh3 is already the tail.
#   - The leader does not broadcast the repaired formation.
#   - This is the simplest decentralized exit case.

