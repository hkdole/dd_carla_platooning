#
# Compile:
# cd ~/omnet6_ws/carla_platooning && make -j"$(nproc)"
#
# Terminal 1 - Run Pycarlanet:
# cd ~/omnet6_ws/carla_platooning/pycarlanet/joinAtBack && python3 main.py
#
# Terminal 2 - Run Carla:
# cd ~/omnet6_ws/CARLA_0.9.15 && ./CarlaUE4.sh 
#
# Terminal 3 - Run Omnetpp:
# cd ~/omnet6_ws/carla_platooning/examples/joinAtBack && mapfile -t configs < <(awk -F'[][]' '/^\[Config /{sub(/^Config /,"",$2); print $2}' omnetpp.ini) && echo "Available scenarios:" && select cfg in "${configs[@]}"; do   [ -n "$cfg" ] || { echo "Invalid selection"; continue; };   echo "Running config: $cfg";   opp_run -m -u Cmdenv     -c "$cfg"     -n ..:../../src:../../../omnetpp-6.0.3/platooning/inet4.5/examples:../../../omnetpp-6.0.3/platooning/inet4.5/showcases:../../../omnetpp-6.0.3/platooning/inet4.5/src:../../../omnetpp-6.0.3/platooning/inet4.5/tests/validation:../../../omnetpp-6.0.3/platooning/inet4.5/tests/networks:../../../omnetpp-6.0.3/platooning/inet4.5/tutorials:../../../veins/examples/veins:../../../veins/src/veins     -x 'inet.common.selfdoc;inet.linklayer.configurator.gatescheduling.z3;inet.emulation;inet.showcases.visualizer.osg;inet.examples.emulation;inet.showcases.emulation;inet.transportlayer.tcp_lwip;inet.applications.voipstream;inet.visualizer.osg;inet.examples.voipstream'     --image-path=../../../omnetpp-6.0.3/platooning/inet4.5/images:../../../veins/images     -l ../../src/carla -l ../../../omnetpp-6.0.3/platooning/inet4.5/src/INET -l ../../../veins/src/veins     omnetpp.ini > "omnetpp_${cfg}.log" 2>&1;   break; done
#
# Run via command to capture logs
# output file: /omnetpp_<scenario>.log
#
# Use extract_omnet_log.py to extract control lines from full run
# cd ~/omnet6_ws/carla_platooning/examples/joinAtBack/logs && python3 extract_omnet_log.py ../omnetpp_<scenario>.log -o omnetpp.log
#
# Use extract_join_semantics.py to extract maneuver lines from full run
# cd ~/omnet6_ws/carla_platooning/examples/joinAtBack/logs && python3 extract_join_semantics.py ../omnetpp_<scenario>.log -o join_maneuver.log
#


###############################################################################
# Shared
###############################################################################
[General]
network = CarlaPlatooningNetwork
sim-time-limit = 6000s
repeat = 1
record-eventlog = false

user-interface = Cmdenv
cmdenv-redirect-output = true
cmdenv-output-file = omnetpp_JoinAtBackFull.log

cmdenv-express-mode = false
cmdenv-autoflush = true
cmdenv-status-frequency = 10s

image-path = ../../images:../../../inet4.5/images:../../../veins/images
*.withStatic = false

# Keep results in raw OMNeT result files, like PLEXE
**.vector-recording = true

##########################################################
# World / ConnectionManager (shared)
##########################################################
*.world.use2D = true
*.world.useTorus = false
*.world.playgroundSizeX = 65000m
*.world.playgroundSizeY = 25000m
*.world.playgroundSizeZ = 50m

*.connectionManager.sendDirect = true
*.connectionManager.maxInterfDist = 2600m
*.connectionManager.drawMaxIntfDist = false
*.connectionManager.carrierFrequency = 5.89e9
*.connectionManager.minPowerLevel = -94dBm
*.connectionManager.useTorus = false

*.connectionManager.worldModule = "^.world"
*.connectionManager.hosts = "actors[*]"

##########################################################
# Bind NICs to ConnectionManager (shared)
##########################################################
**.nic.connectionManagerName = "CarlaPlatooningNetwork.connectionManager"
**.nic.connectionManagerModule = "^.^.connectionManager"

##########################################################
# 802.11p NIC defaults (shared)
##########################################################
*.**.nic.mac1609_4.useServiceChannel = false
*.**.nic.mac1609_4.txPower = 100mW
*.**.nic.mac1609_4.bitrate = 6Mbps
*.**.nic.mac1609_4.useAcks = true
*.**.nic.mac1609_4.ackErrorRate = 0.0
*.**.nic.mac1609_4.frameErrorRate = 0.0

*.**.nic.phy80211p.minPowerLevel = -94dBm
*.**.nic.phy80211p.maxTXPower = 100mW
*.**.nic.phy80211p.useNoiseFloor = true
*.**.nic.phy80211p.noiseFloor = -95dBm
*.**.nic.phy80211p.usePropagationDelay = true

# If you already have these files, keep them; otherwise comment out
**.nic.phy80211p.analogueModels = xmldoc("analogueModels.xml")
**.nic.phy80211p.decider = xmldoc("analogueModels.xml")

##########################################################
# CarlanetManager base connectivity (shared)
##########################################################
*.manager.host = "localhost"
*.manager.port = 5555
*.manager.protocol = "tcp"
*.manager.simulationTimeStep = 0.05s
*.manager.communicationTimeoutms = 1000

*.manager.networkActiveModuleType = "joinAtBack.CarlaPlatooningNode"
*.manager.networkPassiveModuleType = "joinAtBack.CarlaPlatooningNode"

*.manager.connectionManagerPath = "CarlaPlatooningNetwork.connectionManager"
*.manager.worldModulePath = "CarlaPlatooningNetwork.world"

# Default map/seed (can override per config if needed)
*.manager.extraInitParams = parseJSON("{\"map\":\"Town04\"}")
CarlaPlatooningNetwork.manager.carlaSeed = 243

##########################################################
# Mobility (identity; overlay-free) (shared)
##########################################################
**.mobility.flipX = false
**.mobility.flipY = false
**.mobility.scale = 1
**.mobility.rotDeg = 0
**.mobility.offsetX = 0m
**.mobility.offsetY = 0m

**.mobility.netOffsetSign = 0
**.mobility.sumoNetOffsetX = 0m
**.mobility.sumoNetOffsetY = 0m
**.mobility.swapXY = false
**.mobility.preRotDeg = 0
**.mobility.carlaToSumoScale = 1
**.mobility.deltaCanvasX = 0m
**.mobility.deltaCanvasY = 0m

##########################################################
# CarlaGeneralPlatooningApp common timing / identity defaults
##########################################################
**.actors[*].appl.beaconInterval = 0.1s
**.actors[*].appl.control_interval = 0.05s
**.actors[*].appl.max_age = 0.2s

**.actors[*].appl.platoon_id = 0
**.actors[*].appl.leader_id = 0
**.actors[*].appl.vehicle_length = 4.5m

# Updated follower/joiner controller terms
**.actors[*].appl.k_acc_ff = 1.0
**.actors[*].appl.k_leader_dv = 0.15
**.actors[*].appl.k_gap_speed = 0.25
**.actors[*].appl.max_closure_speed = 5.0mps

###############################################################################
# 2-car static demo: leader + follower, stationary
###############################################################################
[Config TwoCarStatic]
description = "Two-car (veh0 leader, veh1 follower) on Town04; stationary; V2V beacons + Bridge CONTROL active."
sim-time-limit = 120s

*.numActors = 2
*.manager.enableLateSpawn = false

*.manager.extraInitParams = parseJSON("{\
  \"map\":\"Town04\",\
  \"bridge_cfg\":{\
    \"enable_leader_profile\":false,\
    \"enable_follower_fallback\":false,\
    \"hold_brake_until_control\":true,\
    \"speed_brake_max\":-4.0,\
    \"follow_brake_max\":-4.0\
  }\
}")

# stop forever
**.actors[*].appl.nominal_platoon_speed = 0mps
**.actors[*].appl.leader_target_speed = 0mps
**.actors[*].appl.a_min = 0
**.actors[*].appl.a_max = 0

# controller gains
**.actors[*].appl.headway = 0.5s
**.actors[*].appl.gap_min = 5m
**.actors[*].appl.k_gap = 0.2
**.actors[*].appl.k_dv = 0.7
**.actors[*].appl.k_speed_p = 0.7

# formation
*.actors[0].appl.initial_formation = "0,1"
*.actors[1].appl.initial_formation = "0,1"

# actor mapping
*.actors[0].appl.actor_id = "veh0"
*.actors[0].appl.platoon_role = "leader"
*.actors[0].appl.node_id = 0

*.actors[1].appl.actor_id = "veh1"
*.actors[1].appl.platoon_role = "follower"
*.actors[1].appl.node_id = 1

###############################################################################
# 2-car moving gap-follow
###############################################################################
[Config TwoCarFollowingV2VGap]
extends = TwoCarStatic
description = "Leader drives; follower accelerates only based on V2V beacons + gap error."
sim-time-limit = 120s

*.manager.extraInitParams = parseJSON("{\
  \"map\":\"Town04\",\
  \"bridge_cfg\":{\
    \"enable_leader_profile\":false,\
    \"enable_follower_fallback\":false,\
    \"hold_brake_until_control\":true,\
    \"speed_brake_max\":-4.0,\
    \"follow_brake_max\":-4.0\
  }\
}")

**.actors[*].appl.a_min = -4.0
**.actors[*].appl.a_max = 2.5

**.actors[*].appl.headway = 0.5s
**.actors[*].appl.gap_min = 15m
**.actors[*].appl.k_gap = 0.2
**.actors[*].appl.k_dv = 0.7
**.actors[*].appl.k_speed_p = 0.7
**.actors[*].appl.k_acc_ff = 1.0
**.actors[*].appl.k_leader_dv = 0.15
**.actors[*].appl.k_gap_speed = 0.25
**.actors[*].appl.max_closure_speed = 5.0mps
**.actors[*].appl.max_age = 0.2s

# follower
*.actors[1].appl.k_speed_p = 0.1
*.actors[1].appl.nominal_platoon_speed = 1mps
*.actors[1].appl.leader_target_speed = 1mps

# leader
*.actors[0].appl.k_speed_p = 0.7
*.actors[0].appl.nominal_platoon_speed = 8mps
*.actors[0].appl.leader_target_speed = 8mps

# test to disable leader beacons
# **.actors[0].appl.beaconInterval = 1000s

###############################################################################
# 2-car gap-follow placeholder
###############################################################################
[Config TwoCarFollowThenBrake]
extends = TwoCarFollowingV2VGap
description = "Placeholder until leader brake profile is implemented in CarlaGeneralPlatooningApp."

###############################################################################
# Full Join At Back Demo: 4-car moving platoon + late spawn
###############################################################################
[Config JoinAtBackFull]
description = "Original 4-car JoinAtBack demo (veh0..veh3) + late spawn veh4 at 5s + join maneuver at 15s."
sim-time-limit = 215s

# old dynamic late spawn
# Caused issues when trying to record vectors for each vehicle from the start of the scenario
# Can't run plexe's generic.parser on result/*.vec output file 

*.numActors = 4

*.manager.enableLateSpawn = true
*.manager.lateSpawnActorId = "veh4"
*.manager.lateSpawnActorType = "car"
*.manager.lateSpawnActorConfig = "{}"
*.manager.lateSpawnTime = 5s
*.manager.dynamicNodeType = "joinAtBack.CarlaPlatooningNode"
*.manager.dynamicNodeNamePrefix = "actors"

# shared
**.actors[*].appl.headway = 0.5s
**.actors[*].appl.gap_min = 5m
**.actors[*].appl.a_min = -4.0
**.actors[*].appl.a_max = 2.5
**.actors[*].appl.max_age = 0.2s
**.actors[*].appl.beaconInterval = 0.1s # timing
**.actors[*].appl.control_interval = 0.05s # timing
**.actors[*].appl.vehicle_length = 4.5m
**.actors[*].appl.nominal_platoon_speed = 10mps

# leader only
*.actors[0].appl.leader_target_speed = 10mps
*.actors[0].appl.k_speed_p = 0.70

# followers only
*.actors[1..3].appl.k_gap = 0.20
*.actors[1..3].appl.k_dv = 0.70
*.actors[1..3].appl.k_acc_ff = 1.0
*.actors[1..3].appl.k_leader_dv = 0.05
*.actors[1..3].appl.k_gap_speed = 0.03
*.actors[1..3].appl.max_closure_speed = 1.0mps

# joiner only
*.actors[4].appl.k_gap = 0.20
*.actors[4].appl.k_dv = 0.70
*.actors[4].appl.k_acc_ff = 1.0
*.actors[4].appl.k_leader_dv = 0.05
*.actors[4].appl.k_gap_speed = 0.03
*.actors[4].appl.max_closure_speed = 1.0mps
*.actors[4].appl.approach_delta_v = 2mps
*.actors[4].appl.in_pos_slack = 0m

# formation
*.actors[0].appl.initial_formation = "0,1,2,3"
*.actors[1].appl.initial_formation = "0,1,2,3"
*.actors[2].appl.initial_formation = "0,1,2,3"
*.actors[3].appl.initial_formation = "0,1,2,3"

# actor mapping
*.actors[0].appl.actor_id = "veh0"
*.actors[0].appl.platoon_role = "leader"
*.actors[0].appl.node_id = 0

*.actors[1].appl.actor_id = "veh1"
*.actors[1].appl.platoon_role = "follower"
*.actors[1].appl.node_id = 1

*.actors[2].appl.actor_id = "veh2"
*.actors[2].appl.platoon_role = "follower"
*.actors[2].appl.node_id = 2

*.actors[3].appl.actor_id = "veh3"
*.actors[3].appl.platoon_role = "follower"
*.actors[3].appl.node_id = 3

# PLEXE-style run labels carried into post-processing
*.actors[1..3].appl.caccXi = ${caccXi}
*.actors[1..3].appl.caccOmegaN = ${caccOmegaN}

# Keep results in raw OMNeT result files, like PLEXE
output-vector-file = results/${configname}_${caccXi=1.0}_${caccOmegaN=0.2}_${runnumber}.vec
output-scalar-file = results/${configname}_${caccXi}_${caccOmegaN}_${runnumber}.sca

# explicit late-spawn joiner overrides
*.actors[4].appl.actor_id = "veh4"
*.actors[4].appl.platoon_role = "joiner"
*.actors[4].appl.node_id = 4

*.actors[4].appl.start_maneuver_at = 15s

*.actors[4].appl.caccXi = ${caccXi}
*.actors[4].appl.caccOmegaN = ${caccOmegaN}
