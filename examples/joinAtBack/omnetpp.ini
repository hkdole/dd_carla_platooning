#
# Compile:
# cd ~/workspace/carla_platooning && make"
#
# Terminal 1 - Run Pycarlanet (captures logs):
# cd ~/workspace/pycarlanet/joinAtBack && python3 main.py 2>&1 | tee pycarlanet.log
#
# output file: /pycarlanet.log
#
# Terminal 2 - Run Carla:
# cd ~/workspace/CARLA_0.9.15 && ./CarlaUE4.sh 
#
# Terminal 3 - Run Omnetpp (captures logs):
# cd ~/workspace/carla_platooning/examples/joinAtBack && mapfile -t configs < <(awk -F'[][]' '/^\[Config /{sub(/^Config /,"",$2); print $2}' omnetpp.ini) && echo "Available scenarios:" && select cfg in "${configs[@]}"; do [ -n "$cfg" ] || { echo "Invalid selection"; continue; }; echo "Running config: $cfg"; opp_run -m -u Cmdenv -c "$cfg" -n ..:../../src:../../../carlanetpp/src:../../../omnetpp-6.0.3/platooning/inet4.5/examples:../../../omnetpp-6.0.3/platooning/inet4.5/showcases:../../../omnetpp-6.0.3/platooning/inet4.5/src:../../../omnetpp-6.0.3/platooning/inet4.5/tests/validation:../../../omnetpp-6.0.3/platooning/inet4.5/tests/networks:../../../omnetpp-6.0.3/platooning/inet4.5/tutorials:../../../veins/examples/veins:../../../veins/src/veins:../../../plexe/examples/joinManeuver:../../../plexe/src/plexe -x 'inet.common.selfdoc;inet.linklayer.configurator.gatescheduling.z3;inet.emulation;inet.showcases.visualizer.osg;inet.examples.emulation;inet.showcases.emulation;inet.transportlayer.tcp_lwip;inet.applications.voipstream;inet.visualizer.osg;inet.examples.voipstream' --image-path=../../../omnetpp-6.0.3/platooning/inet4.5/images:../../../veins/images:../../../plexe/images -l ../../src/carla -l ../../../carlanetpp/src/carlanet -l ../../../omnetpp-6.0.3/platooning/inet4.5/src/INET -l ../../../veins/src/veins -l ../../../plexe/src/plexe omnetpp.ini > "omnetpp_${cfg}.log" 2>&1; status=$?; echo "Exit code: $status"; echo "Log: $(pwd)/omnetpp_${cfg}.log"; break; done
#
# output file: /omnetpp_<scenario>.log
#
# Use extract_omnet_log.py to extract control lines from full run
# cd ~/workspace/carla_platooning/examples/joinAtBack/logs && python3 extract_omnet_log.py ../omnetpp_<scenario>.log -o omnetpp.log
#
# output file: /omnetpp.log
#
# Use extract_join_semantics.py to extract maneuver lines from full run
# cd ~/workspace/carla_platooning/examples/joinAtBack/logs && python3 extract_join_semantics.py ../omnetpp_<scenario>.log -o join_maneuver.log
#
# output file: /join_maneuver.log
#
# Use extract_real_positions.py to extract vehicle positions from Carla and check gap from full run
# cd ~/workspace/carla_platooning/examples/joinAtBack/logs && python3 extract_real_positions.py ../omnetpp_JoinAtBackFull.log --sample-period 1.0 --target-gap 5.0 --gap-tolerance 1.0
#
# output file: /real_positions_summary.csv
#


###############################################################################
# Shared
###############################################################################
[General]
network = CarlaPlatooningNetwork
sim-time-limit = 6000s
repeat = 1
record-eventlog = false

user-interface = Cmdenv
cmdenv-redirect-output = true
cmdenv-output-file = omnetpp_JoinAtBackFull.log

cmdenv-express-mode = false
cmdenv-autoflush = true
cmdenv-status-frequency = 10s

image-path = ../../images:../../../inet4.5/images:../../../veins/images
*.withStatic = false

# Keep results in raw OMNeT result files, like PLEXE
**.vector-recording = true

##########################################################
# World / ConnectionManager (shared)
##########################################################
*.world.use2D = true
*.world.useTorus = false
*.world.playgroundSizeX = 65000m
*.world.playgroundSizeY = 25000m
*.world.playgroundSizeZ = 50m

*.connectionManager.sendDirect = true
*.connectionManager.maxInterfDist = 2600m
*.connectionManager.drawMaxIntfDist = false
*.connectionManager.carrierFrequency = 5.89e9
*.connectionManager.minPowerLevel = -94dBm
*.connectionManager.useTorus = false

*.connectionManager.worldModule = "^.world"
*.connectionManager.hosts = "actors[*]"

##########################################################
# Bind NICs to ConnectionManager (shared)
##########################################################
**.nic.connectionManagerName = "CarlaPlatooningNetwork.connectionManager"
**.nic.connectionManagerModule = "^.^.connectionManager"

##########################################################
# 802.11p NIC defaults (shared)
##########################################################
*.**.nic.mac1609_4.useServiceChannel = false
*.**.nic.mac1609_4.txPower = 100mW
*.**.nic.mac1609_4.bitrate = 6Mbps
*.**.nic.mac1609_4.useAcks = true
*.**.nic.mac1609_4.ackErrorRate = 0.0
*.**.nic.mac1609_4.frameErrorRate = 0.0

*.**.nic.phy80211p.minPowerLevel = -94dBm
*.**.nic.phy80211p.maxTXPower = 100mW
*.**.nic.phy80211p.useNoiseFloor = true
*.**.nic.phy80211p.noiseFloor = -95dBm
*.**.nic.phy80211p.usePropagationDelay = true

# If you already have these files, keep them; otherwise comment out
**.nic.phy80211p.analogueModels = xmldoc("analogueModels.xml")
**.nic.phy80211p.decider = xmldoc("analogueModels.xml")

##########################################################
# CarlanetManager base connectivity (shared)
##########################################################
*.manager.host = "localhost"
*.manager.port = 5555
*.manager.protocol = "tcp"
*.manager.simulationTimeStep = 0.05s          # CARLA/OMNeT++ lockstep step; should match control_interval.
*.manager.communicationTimeoutms = 1000       # Max wait for pyCARLANeT response before failure.

*.manager.networkActiveModuleType = "joinAtBack.CarlaPlatooningNode"   # OMNeT++ vehicle module type.
*.manager.networkPassiveModuleType = "joinAtBack.CarlaPlatooningNode"  # Same node type for bridge-created vehicles.

*.manager.connectionManagerPath = "CarlaPlatooningNetwork.connectionManager"
*.manager.worldModulePath = "CarlaPlatooningNetwork.world"

# Default map/seed (can override per config if needed)
*.manager.extraInitParams = parseJSON("{\"map\":\"Town04\"}")          # CARLA map used by default.
CarlaPlatooningNetwork.manager.carlaSeed = 243                         # Fixed seed for repeatability.

##########################################################
# Mobility (identity; overlay-free) (shared)
##########################################################
**.mobility.flipX = false
**.mobility.flipY = false
**.mobility.scale = 1
**.mobility.rotDeg = 0
**.mobility.offsetX = 0m
**.mobility.offsetY = 0m

**.mobility.netOffsetSign = 0
**.mobility.sumoNetOffsetX = 0m
**.mobility.sumoNetOffsetY = 0m
**.mobility.swapXY = false
**.mobility.preRotDeg = 0
**.mobility.carlaToSumoScale = 1
**.mobility.deltaCanvasX = 0m
**.mobility.deltaCanvasY = 0m

##########################################################
# CarlaGeneralPlatooningApp common timing / identity defaults
##########################################################
**.actors[*].appl.beaconInterval = 0.05s
**.actors[*].appl.control_interval = 0.05s
**.actors[*].appl.max_age = 0.2s

**.actors[*].appl.platoon_id = 0
**.actors[*].appl.leader_id = 0
**.actors[*].appl.vehicle_length = 4.5m

# Updated follower/joiner controller terms
**.actors[*].appl.k_acc_ff = 1.0
**.actors[*].appl.k_leader_dv = 0.15
**.actors[*].appl.k_gap_speed = 0.25
**.actors[*].appl.max_closure_speed = 5.0mps

###############################################################################
# 2-car static demo: leader + follower, stationary
###############################################################################
[Config TwoCarStatic]
description = "Two-car (veh0 leader, veh1 follower) on Town04; stationary; V2V beacons + Bridge CONTROL active."
sim-time-limit = 120s

*.numActors = 2
*.manager.enableLateSpawn = false

*.manager.extraInitParams = parseJSON("{\
  \"map\":\"Town04\",\
  \"bridge_cfg\":{\
    \"enable_leader_profile\":false,\
    \"enable_follower_fallback\":false,\
    \"hold_brake_until_control\":true,\
    \"speed_brake_max\":-4.0,\
    \"follow_brake_max\":-4.0\
  }\
}")

# stop forever
**.actors[*].appl.nominal_platoon_speed = 0mps
**.actors[*].appl.leader_target_speed = 0mps
**.actors[*].appl.a_min = 0
**.actors[*].appl.a_max = 0

# controller gains
**.actors[*].appl.headway = 0.5s
**.actors[*].appl.gap_min = 5m
**.actors[*].appl.k_gap = 0.2
**.actors[*].appl.k_dv = 0.7
**.actors[*].appl.k_speed_p = 0.7

# formation
*.actors[0].appl.initial_formation = "0,1"
*.actors[1].appl.initial_formation = "0,1"

# actor mapping
*.actors[0].appl.actor_id = "veh0"
*.actors[0].appl.platoon_role = "leader"
*.actors[0].appl.node_id = 0

*.actors[1].appl.actor_id = "veh1"
*.actors[1].appl.platoon_role = "follower"
*.actors[1].appl.node_id = 1

###############################################################################
# 2-car moving gap-follow
###############################################################################
[Config TwoCarFollowingV2VGap]
extends = TwoCarStatic
description = "Leader drives; follower accelerates only based on V2V beacons + gap error."
sim-time-limit = 120s

*.manager.extraInitParams = parseJSON("{\
  \"map\":\"Town04\",\
  \"bridge_cfg\":{\
    \"enable_leader_profile\":false,\
    \"enable_follower_fallback\":false,\
    \"hold_brake_until_control\":true,\
    \"speed_brake_max\":-4.0,\
    \"follow_brake_max\":-4.0\
  }\
}")

**.actors[*].appl.a_min = -4.0
**.actors[*].appl.a_max = 2.5

**.actors[*].appl.headway = 0.5s
**.actors[*].appl.gap_min = 15m
**.actors[*].appl.k_gap = 0.2
**.actors[*].appl.k_dv = 0.7
**.actors[*].appl.k_speed_p = 0.7
**.actors[*].appl.k_acc_ff = 1.0
**.actors[*].appl.k_leader_dv = 0.15
**.actors[*].appl.k_gap_speed = 0.25
**.actors[*].appl.max_closure_speed = 5.0mps
**.actors[*].appl.max_age = 0.2s

# follower
*.actors[1].appl.k_speed_p = 0.1
*.actors[1].appl.nominal_platoon_speed = 1mps
*.actors[1].appl.leader_target_speed = 1mps

# leader
*.actors[0].appl.k_speed_p = 0.7
*.actors[0].appl.nominal_platoon_speed = 8mps
*.actors[0].appl.leader_target_speed = 8mps

# test to disable leader beacons
# **.actors[0].appl.beaconInterval = 1000s

###############################################################################
# 2-car gap-follow placeholder
###############################################################################
[Config TwoCarFollowThenBrake]
extends = TwoCarFollowingV2VGap
description = "Placeholder until leader brake profile is implemented in CarlaGeneralPlatooningApp."

###############################################################################
# Full Join At Back Demo: 4-car moving platoon + late-spawn joiner
###############################################################################
[Config JoinAtBackFull]
description = "Baseline centralized JoinAtBack: veh0..veh3 form a platoon; veh4 spawns later and joins at the back."
sim-time-limit = 140s                              # Total simulated time for this scenario.

*.numActors = 4                                    # Vehicles created at t=0: veh0 leader + veh1..veh3 followers.

*.manager.enableLateSpawn = true                   # Enables dynamic creation of a vehicle after t=0.
*.manager.lateSpawnActorId = "veh4"                # CARLA/bridge ID for the late-spawned joiner.
*.manager.lateSpawnActorType = "car"               # Actor type requested from the Python/CARLA bridge.
*.manager.lateSpawnTime = 5s                       # Time when veh4 is created in the simulation.
*.manager.dynamicNodeType = "joinAtBack.CarlaPlatooningNode"  # OMNeT++ module type used for the late-spawned vehicle.
*.manager.dynamicNodeNamePrefix = "actors"         # Module-name prefix for dynamically created actors.

# Late-spawned joiner configuration.
# Key embedded fields:
#   platoon_role="joiner"  -> veh4 starts outside normal follower behavior.
#   node_id=4              -> numeric ID used in V2V messages and formation lists.
#   join_position=4        -> desired final position behind veh3.
#   start_maneuver_at=15   -> veh4 begins join protocol at t=15s.
#   approach_delta_v       -> extra catch-up speed while approaching the platoon.
#   in_pos_slack           -> tolerance for deciding the joiner is close enough.
*.manager.lateSpawnActorConfig = "{\
  \"carla\": {},\
  \"appl\": {\
    \"actor_id\": \"veh4\",\
    \"platoon_role\": \"joiner\",\
    \"node_id\": 4,\
    \"platoon_id\": 0,\
    \"leader_id\": 0,\
    \"join_position\": 4,\
    \
    \"nominal_platoon_speed\": 10,\
    \"leader_target_speed\": 10,\
    \
    \"headway\": 0.5,\
    \"gap_min\": 5,\
    \"vehicle_length\": 4.5,\
    \
    \"a_min\": -4.0,\
    \"a_max\": 2.5,\
    \"max_closure_speed\": 1.0,\
    \
    \"max_age\": 0.2,\
    \"control_interval\": 0.05,\
    \
    \"k_gap\": 0.35,\
    \"k_dv\": 0.90,\
    \"k_acc_ff\": 1.0,\
    \"k_leader_dv\": 0.05,\
    \"k_gap_speed\": 0.05,\
    \
    \"approach_delta_v\": 8.333,\
    \"in_pos_slack\": 11,\
    \"start_maneuver_at\": 15,\
    \
    \"caccXi\": 1.0,\
    \"caccOmegaN\": 0.2\
  }\
}"

**.actors[*].appl.headway = 0.5s                   # Time-headway spacing term; desired gap often includes headway * speed.
**.actors[*].appl.gap_min = 5m                     # Minimum desired bumper-to-bumper spacing.
**.actors[*].appl.a_min = -4.0                     # Maximum braking/deceleration command in m/s^2.
**.actors[*].appl.a_max = 2.5                      # Maximum acceleration command in m/s^2.
**.actors[*].appl.max_age = 0.2s                   # Beacon data older than this is treated as stale.
**.actors[*].appl.beaconInterval = 0.05s           # How often each vehicle broadcasts V2V state.
**.actors[*].appl.control_interval = 0.05s         # How often each vehicle computes a new control command.
**.actors[*].appl.vehicle_length = 4.5m            # Vehicle length used when converting positions to physical gaps.
**.actors[*].appl.nominal_platoon_speed = 10mps    # Intended cruise speed for the platoon.

*.actors[0].appl.leader_target_speed = 10mps       # Leader's direct speed target; followers should not simply copy this.
*.actors[0].appl.k_speed_p = 0.70                  # Leader speed-tracking proportional gain.

*.actors[1..3].appl.k_gap = 0.35                   # Follower response gain for spacing/gap error.
*.actors[1..3].appl.k_dv = 0.90                    # Follower damping gain for relative speed to predecessor.
*.actors[1..3].appl.k_acc_ff = 1.0                 # Acceleration feedforward gain from received V2V state.
*.actors[1..3].appl.k_leader_dv = 0.05             # Correction gain using relative speed to the leader.
*.actors[1..3].appl.k_gap_speed = 0.05             # Converts gap error into a speed correction.
*.actors[1..3].appl.max_closure_speed = 1.0mps     # Caps how quickly a follower closes distance to its target.

*.actors[0].appl.initial_formation = "0,1,2,3"     # Initial front-to-back platoon order known by veh0.
*.actors[1].appl.initial_formation = "0,1,2,3"     # Initial front-to-back platoon order known by veh1.
*.actors[2].appl.initial_formation = "0,1,2,3"     # Initial front-to-back platoon order known by veh2.
*.actors[3].appl.initial_formation = "0,1,2,3"     # Initial front-to-back platoon order known by veh3.

*.actors[0].appl.actor_id = "veh0"                 # CARLA/bridge vehicle name for actor 0.
*.actors[0].appl.platoon_role = "leader"           # veh0 uses leader behavior.
*.actors[0].appl.node_id = 0                       # Numeric platooning/message ID for veh0.

*.actors[1].appl.actor_id = "veh1"                 # CARLA/bridge vehicle name for actor 1.
*.actors[1].appl.platoon_role = "follower"         # veh1 uses follower behavior.
*.actors[1].appl.node_id = 1                       # Numeric platooning/message ID for veh1.

*.actors[2].appl.actor_id = "veh2"                 # CARLA/bridge vehicle name for actor 2.
*.actors[2].appl.platoon_role = "follower"         # veh2 uses follower behavior.
*.actors[2].appl.node_id = 2                       # Numeric platooning/message ID for veh2.

*.actors[3].appl.actor_id = "veh3"                 # CARLA/bridge vehicle name for actor 3.
*.actors[3].appl.platoon_role = "follower"         # veh3 uses follower behavior.
*.actors[3].appl.node_id = 3                       # Numeric platooning/message ID for veh3.

*.actors[1..3].appl.caccXi = ${caccXi}             # Plexe-style label/parameter carried into analysis output.
*.actors[1..3].appl.caccOmegaN = ${caccOmegaN}     # Plexe-style label/parameter carried into analysis output.

output-vector-file = results/${configname}_${caccXi=1.0}_${caccOmegaN=0.2}_${runnumber}.vec  # Time-series result file.
output-scalar-file = results/${configname}_${caccXi}_${caccOmegaN}_${runnumber}.sca          # Scalar summary result file.


