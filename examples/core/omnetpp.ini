[General]
network = CarlaPlatoonDemo
sim-time-limit = 60s
repeat = 1
record-eventlog = false

cmdenv-express-mode = true
cmdenv-autoflush = true
cmdenv-status-frequency = 10s

image-path = ../../images:../../../inet4.5/images:../../../veins/images

# --- default: dynamic nodes only
*.withStatic = false

##########################################################
# World / ConnectionManager
##########################################################

*.world.use2D = true
*.world.useTorus = false
*.world.playgroundSizeX = 10000m
*.world.playgroundSizeY = 10000m
*.world.playgroundSizeZ = 50m

*.connectionManager.sendDirect = true
*.connectionManager.maxInterfDist = 1000m
*.connectionManager.drawMaxIntfDist = false
*.connectionManager.carrierFrequency = 5.89e9
*.connectionManager.minPowerLevel = -110dBm
*.connectionManager.useTorus = false

# ConnectionManager ↔ world (Veins style)
*.connectionManager.worldModule = "^.world"
# IMPORTANT: hosts must match your actual module names
*.connectionManager.hosts = "actors[*]"

##########################################################
# Strongly bind NICs to ConnectionManager
##########################################################

# NICs know where the ConnectionManager is
**.nic.connectionManagerName = "CarlaPlatoonDemo.connectionManager"
**.nic.connectionManagerModule = "^.^.connectionManager"

*.connectionManager.coreDebug = true
*.connectionManager.debug = true
**.nic.mac1609_4.debug = true
**.nic.phy80211p.debug = true
**.nic.phy80211p.recordStats = true


##########################################################
# CarlanetManager
##########################################################

*.manager.host = "localhost"
*.manager.port = 5555
*.manager.protocol = "tcp"
*.manager.simulationTimeStep = 0.05s
*.manager.communicationTimeoutms = 1000

*.manager.networkActiveModuleType  = "core.CarlaNodeCACC"
*.manager.networkPassiveModuleType = "core.CarlaNodeCACC"

# IMPORTANT: absolute paths (no ^, no .)
*.manager.connectionManagerPath = "CarlaPlatoonDemo.connectionManager"
*.manager.worldModulePath       = "CarlaPlatoonDemo.world"

##########################################################
# Mobility / canvas
##########################################################

**.**.mobility.swapXY = false
**.**.mobility.preRotDeg = 0
**.**.mobility.netOffsetSign = 1
**.**.mobility.sumoNetOffsetX = 0m
**.**.mobility.sumoNetOffsetY = 0m
**.**.mobility.carlaToSumoScale = 1
**.**.mobility.deltaCanvasX = 0m
**.**.mobility.deltaCanvasY = 0m

##########################################################
# 802.11p NIC (Veins)
##########################################################

**.nic.phy80211p.usePropagationDelay = true
**.nic.phy80211p.useNoiseFloor = true
**.nic.phy80211p.noiseFloor = -98dBm
**.nic.phy80211p.thermalNoise = -110dBm
**.nic.phy80211p.sensitivity  = -95dBm
**.nic.phy80211p.useTwoRayModel = false

# Analogue models / decider XML (adapt file name if needed)
**.nic.phy80211p.analogueModels = xmldoc("analogueModels.xml")
**.nic.phy80211p.decider        = xmldoc("analogueModels.xml")

**.nic.mac1609_4.useServiceChannel = false
**.nic.mac1609_4.headerLength = 32B
**.nic.mac1609_4.queue.dataQueueLength = 100
**.nic.mac1609_4.txPower = 50mW
**.nic.mac1609_4.bitrate = 6Mbps

# PHY cutoff (also matches ConnectionManager.minPowerLevel)
**.nic.phy80211p.minPowerLevel = -110dBm

##########################################################
# CarlaPloegApp (appl submodule in CarlaNodeCACC)
##########################################################

# DO NOT use sendEveryMs – CarlaPloegApp doesn’t have it
# **.appl.sendEveryMs = 100   <-- removed

# Real control / beacon parameters used in CarlaPloegApp
**.actors[*].appl.beaconInterval  = 0.5s     # 10 Hz beacons
**.actors[*].appl.controlInterval = 0.05s    # match Carlanet dt

# Ploeg-like spacing policy parameters
**.actors[*].appl.h        = 0.6s
**.actors[*].appl.r0       = 2m
**.actors[*].appl.kGain    = 0.6
**.actors[*].appl.vDesired = 6mps
**.actors[0].appl.myId = 0
**.actors[1].appl.myId = 1
**.actors[2].appl.myId = 2
# (Optional) explicit roles if not assigned by Python/manager
# **.actors[0].appl.roleName = "leader"
# **.actors[1].appl.roleName = "member"
# **.actors[2].appl.roleName = "joiner"

##########################################################
# SUMO overlay (background only, not TraCI)
##########################################################

**.overlay.netXml = xmldoc("/home/rancher/omnet6_ws/carla_platooning/examples/core/sumocfg/town01/town.net.xml")
**.overlay.flipX = true
**.overlay.flipY = false
**.overlay.autoFit = true
**.overlay.preserveAspect = true
**.overlay.fitWidth = 480m
**.overlay.fitHeight = 360m
**.overlay.fitMargin = 0m
**.overlay.rotDeg = 0
**.overlay.scale = 1
**.overlay.offsetX = 0m
**.overlay.offsetY = 0m
**.overlay.antiAlias = true

##########################################################
# Visualizers (INET)
##########################################################

*.visualizer.*.sceneVisualizer.typename = "IntegratedCanvasVisualizer"
*.visualizer.*.sceneVisualizer.displayModuleNames = false
*.visualizer.*.mobilityVisualizer.displayVelocities = false
*.visualizer.*.mobilityVisualizer.displayMovementTrails = false
*.visualizer.*.mobilityVisualizer.moduleFilter = "**.manager"
*.visualizer.*.axisVisualizer.typename = ""
*.visualizer.*.gridVisualizer.typename = ""


*.**.phy80211p.registrationDelay = 0.01s
